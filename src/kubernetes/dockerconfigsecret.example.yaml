# Пример манифеста. Реальный секрет НЕ коммитить: скопируйте этот файл в
# dockerconfigsecret.yaml (он в .gitignore) и подставьте валидный .dockerconfigjson,
# либо сгенерируйте его командой (PAT не хранить в git):
# kubectl create secret docker-registry dockerconfigjson -n cinemaabyss \
#   --docker-server=ghcr.io --docker-username=zahnah --docker-password=$PAT \
#   --dry-run=client -o yaml > src/kubernetes/dockerconfigsecret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson
  namespace: cinemaabyss
data:
  # base64 от {"auths":{}} — плейсхолдер без реальных учётных данных
  .dockerconfigjson: eyJhdXRocyI6e319
type: kubernetes.io/dockerconfigjson
